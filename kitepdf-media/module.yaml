# The ONLY module allowed to depend on KitePlayer, and through it on FFmpeg. It plays the audio and video
# elements of an EPUB page in the viewer's page overlay (#31). The targets are the ones KitePlayer's Compose
# video publishes: Android, iOS and the desktop JVM. KitePlayer needs Android minSdk 26.

product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64

description: >-
  Optional audio and video for KitePDF - plays the media elements of an EPUB page in the Compose viewer with
  KitePlayer. The engine and viewer artifacts do not depend on a player or a codec; only add this if your app plays
  book media.

apply:
  - //common.module-template.yaml
  - //library.module-template.yaml
  - //compose.module-template.yaml

dependencies:
  - //kitepdf-epub: exported
  - //kitepdf-compose-viewer: exported
  - $libs.kiteplayer: exported
  - $libs.kiteplayer.compose: exported

# A headless Compose scene for the tests. navigationevent sends the back event that a desktop window
# makes of Escape, since a test scene has no window.
test-dependencies@jvm:
  - $compose.desktop.currentOs
  - $compose.uiTest
  - $libs.compose.navigationevent

settings:
  kotlin:
    optIns: [ kotlin.RequiresOptIn ]
  jvm:
    test:
      systemProperties:
        java.awt.headless: "true"
  android:
    namespace: io.github.yuroyami.kitepdf.media
    minSdk: 26
  publishing:
    pom:
      name: KitePDF Media

# Gradle named the klib "io.github.yuroyami:kitepdf-media". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf-media, -Xshort-module-name=kitepdf-media ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf-media, -Xshort-module-name=kitepdf-media ]

# Tests compile into their own klib, which needs a different name. The test blocks name the
# same platforms as the blocks above, so the toolchain applies them last.
test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitepdf-media_test, -Xshort-module-name=kitepdf-media_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitepdf-media_test, -Xshort-module-name=kitepdf-media_test ]

plugins:
  abi-check:
    enabled: true
    # Also checks the Android classes against api/android, as the Gradle build did.
    android: true
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ iosArm64, iosSimulatorArm64 ]
  dokka:
    enabled: true
    moduleName: kitepdf-media
    includes: [ Module.md ]
    customStyleSheets: [ ../docs/api-theme/kite.css ]
    templatesDir: ../dokka-templates
    footerMessage: Apache-2.0 · KitePDF is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/KitePDF/blob/main/kitepdf-media/src
