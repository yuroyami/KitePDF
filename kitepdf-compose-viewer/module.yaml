# The optional Compose Multiplatform viewer. The document artifacts carry no UI dependency,
# so CLI and server consumers pull in none. Anything Compose-specific lives here.

product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - iosArm64
    - iosSimulatorArm64
    - macosArm64

description: >-
  Compose Multiplatform viewer for KitePDF - one KiteDocView composable that renders PDF and EPUB pages into a
  Compose Canvas, with zoom, paging, text selection and navigation widgets.

apply:
  - //common.module-template.yaml
  - //library.module-template.yaml
  - //compose.module-template.yaml

dependencies:
  - //kitepdf-pdf
  - //kitepdf-epub
  - $compose.runtime: exported
  - $compose.foundation: exported
  - $compose.ui: exported

# The Skiko native runtimes rasterize an ImageBitmap headlessly. A module file has no host
# condition, so all six are listed. Skiko loads the one that matches the host.
test-dependencies@jvm:
  - //kitepdf-difftest
  - //kitepdf-javascript
  - $libs.skiko.awt.runtime.macos.arm64
  - $libs.skiko.awt.runtime.macos.x64
  - $libs.skiko.awt.runtime.linux.x64
  - $libs.skiko.awt.runtime.linux.arm64
  - $libs.skiko.awt.runtime.windows.x64
  - $libs.skiko.awt.runtime.windows.arm64

test-dependencies@android:
  - $libs.robolectric

settings:
  kotlin:
    optIns: [ androidx.compose.ui.ExperimentalComposeUiApi, androidx.compose.foundation.ExperimentalFoundationApi ]
  jvm:
    test:
      # EpubConformanceTest reads the W3C EPUB test suite from kitepdf.epubTests. CI checks it out under
      # .epub-tests. Elsewhere, set KITEPDF_EPUB_TESTS to the tests folder of a checkout.
      systemProperties:
        java.awt.headless: "true"
        kitepdf.epubTests: "../.epub-tests/tests"
  android:
    namespace: io.github.yuroyami.kitepdf.compose
    minSdk: 24
  publishing:
    pom:
      name: KitePDF Compose Viewer

# Gradle named the klib "io.github.yuroyami:kitepdf-compose-viewer". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kitepdf-compose-viewer ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kitepdf-compose-viewer ]

settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf-compose-viewer, -Xshort-module-name=kitepdf-compose-viewer ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf-compose-viewer, -Xshort-module-name=kitepdf-compose-viewer ]

settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf-compose-viewer, -Xshort-module-name=kitepdf-compose-viewer ]

# Tests compile into their own klib, which needs a different name. The test blocks name the
# same platforms as the blocks above, so the toolchain applies them last.
test-settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kitepdf-compose-viewer_test ]

test-settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kitepdf-compose-viewer_test ]

test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitepdf-compose-viewer_test, -Xshort-module-name=kitepdf-compose-viewer_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitepdf-compose-viewer_test, -Xshort-module-name=kitepdf-compose-viewer_test ]

test-settings@macosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kitepdf-compose-viewer_test, -Xshort-module-name=kitepdf-compose-viewer_test ]

plugins:
  abi-check:
    enabled: true
    # Also checks the Android classes against api/android, as the Gradle build did.
    android: true
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ iosArm64, iosSimulatorArm64, js, macosArm64, wasmJs ]
  dokka:
    enabled: true
    moduleName: kitepdf-compose-viewer
    includes: [ Module.md ]
    customStyleSheets: [ ../docs/api-theme/kite.css ]
    templatesDir: ../dokka-templates
    footerMessage: Apache-2.0 · KitePDF is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/KitePDF/blob/main/kitepdf-compose-viewer/src
