settings@tvosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf-pdf, -Xshort-module-name=kitepdf-pdf ]

settings@tvosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf-pdf, -Xshort-module-name=kitepdf-pdf ]

settings@watchosArm32:
