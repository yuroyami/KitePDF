# The PDF handler. Its only runtime dependencies are kotlin-stdlib and kitepdf-core, which brings
# ImageKodec for the image codecs. All common Kotlin, with no cinterop, so every target is on.

product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - wasmWasi
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - linuxX64
    - linuxArm64
    - mingwX64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX86
    - androidNativeX64

description: >-
  Pure-Kotlin Multiplatform PDF engine - parse, render, edit and write PDFs with no platform dependencies.

apply:
  - //common.module-template.yaml
  - //library.module-template.yaml

dependencies:
  - //kitepdf-core: exported

test-dependencies:
  - $libs.imagekodec

test-dependencies@jvm:
  - //kitepdf-difftest

settings:
  kotlin:
    optIns: [ kotlin.RequiresOptIn, io.github.yuroyami.kitepdf.core.KiteRawApi, kotlin.experimental.ExperimentalNativeApi ]
  android:
    namespace: io.github.yuroyami.kitepdf
  publishing:
    pom:
      name: KitePDF PDF

# Gradle named the klib "io.github.yuroyami:kitepdf-pdf". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kitepdf-pdf ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kitepdf-pdf ]

settings@wasmWasi:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kitepdf-pdf ]

settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf-pdf, -Xshort-module-name=kitepdf-pdf ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf-pdf, -Xshort-module-name=kitepdf-pdf ]

settings@iosX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf-pdf, -Xshort-module-name=kitepdf-pdf ]

settings@macosArm64:
