plugins:
  version-constant:
    enabled: true
    file: src/io/github/yuroyami/kitepdf/Version.kt
  abi-check:
    enabled: true
    # Also checks the Android classes against api/android, as the Gradle build did.
    android: true
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ androidNativeArm32, androidNativeArm64, androidNativeX64, androidNativeX86, iosArm64, iosSimulatorArm64, iosX64, js, linuxArm64, linuxX64, macosArm64, mingwX64, tvosArm64, tvosSimulatorArm64, wasmJs, wasmWasi, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64 ]
  dokka:
    enabled: true
    moduleName: kitepdf-pdf
    includes: [ Module.md ]
    platformSourceDirs: [ src@jvm, src@android, src@apple ]
    customStyleSheets: [ ../docs/api-theme/kite.css ]
    templatesDir: ../dokka-templates
    footerMessage: Apache-2.0 · KitePDF is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/KitePDF/blob/main/kitepdf-pdf/src
