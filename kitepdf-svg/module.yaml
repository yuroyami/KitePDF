# The SVG renderer that EPUB and CBZ draw inside their pages, and a handler for a standalone .svg file.

product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - wasmWasi
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - linuxX64
    - linuxArm64
    - mingwX64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX86
    - androidNativeX64

description: >-
  Pure-Kotlin Multiplatform SVG support for KitePDF - opens a standalone .svg as a one-page document and draws
  vector art embedded in other formats.

apply:
  - //common.module-template.yaml
  - //library.module-template.yaml

dependencies:
  - //kitepdf-core: exported

settings:
  kotlin:
    optIns: [ kotlin.RequiresOptIn, kotlin.experimental.ExperimentalNativeApi ]
  android:
    namespace: io.github.yuroyami.kitepdf.svg
  publishing:
    pom:
      name: KitePDF SVG

# Gradle named the klib "io.github.yuroyami:kitepdf-svg". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kitepdf-svg ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kitepdf-svg ]

settings@wasmWasi:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kitepdf-svg ]

settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf-svg, -Xshort-module-name=kitepdf-svg ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf-svg, -Xshort-module-name=kitepdf-svg ]

