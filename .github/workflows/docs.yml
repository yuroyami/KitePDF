name: Docs

# Builds the MkDocs Material site + the Dokka API reference and deploys both to
# GitHub Pages (https://yuroyami.github.io/KitePDF/). The API reference lands at
# /api/ to match the "API reference ▸" link in mkdocs.yml.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**/*.kt'
      - '**/Module.md'
      - '**/module.yaml'
      - '*.module-template.yaml'
      - 'project.yaml'
      - 'libs.versions.toml'
      - 'kotlin'
      - 'build-plugins/**'
      - 'dokka-templates/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  build:
    # The API reference documents src@apple, which only a Mac has the platform libraries for.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt

      - name: Build the docs site
        run: mkdocs build --strict --site-dir site

      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      # src@android pages resolve the Android API from this platform.
      - name: Install the Android SDK platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2"'

      # The pages of src@apple, src@posixFile and src@js resolve the types of other modules from their klibs.
      # Dokka reads them from build/tasks, and the standard libraries from the toolchain cache.
      - name: Build the klibs that the platform pages read
        run: ./kotlin build -p macosArm64 -p linuxX64 -p js

      - name: Generate the Dokka API reference
        run: |
          # `do` is a command of the kotlin script here, not the shell keyword.
          # `dokkaSite` reads the output of `dokka`, so it runs `dokka` first.
          # shellcheck disable=SC1010
          ./kotlin do dokkaSite

      - name: Verify the complete API reference
        run: |
          for module in \
            kitepdf kitepdf-core kitepdf-pdf kitepdf-epub kitepdf-cbz kitepdf-svg kitepdf-xps kitepdf-javascript kitepdf-net \
            kitepdf-compose-viewer kitepdf-media kitepdf-native-renderer kitepdf-skia-renderer
          do
            test -f "build/dokka/html/$module/index.html"
          done
          if grep -rl 'ERROR CLASS' build/dokka/html; then exit 1; fi

      - name: Merge the API reference into the site
        run: |
          mkdir -p site/api
          cp -r build/dokka/html/. site/api/
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
