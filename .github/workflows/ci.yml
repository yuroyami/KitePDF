name: CI

# Build and test gates. Every job builds with the Kotlin Toolchain (the ./kotlin script), which downloads
# its own JDK, Kotlin/Native, Node and Chrome into a cache folder.
#
# - `jvm` (Linux) is the REQUIRED gate: the JVM target is the canonical build of the common code, and
#   the differential and oracle suites run here (they use a pinned, colour-managed mutool build, and a
#   pinned PDFium for the parity check). It also runs the common tests through the Android host tests.
# - `apple` and `web` prove the non-JVM targets compile AND pass the common tests before merge.
#   Platform regressions are therefore merge-blocking, instead of being discovered only after they land.
# - `other-targets` does the same for the rest of what we publish: it runs the common tests on Linux x64,
#   and compiles Linux arm64, Windows and the Android native ABIs, so none of them rots unseen (#562).
# - `other-apple` builds the Apple targets that `apple` does not: iOS devices, the Intel iOS simulator,
#   tvOS and watchOS.
# - `api` compiles the libraries of every target on macOS, the one host that compiles them all, and checks
#   the public API of each published module against the dumps in its api/ directory. It then publishes the
#   libraries to Maven Local and builds the Gradle project in consumer-test/ against them, by coordinates,
#   as an application does. A broken POM or a missing dependency fails there before a release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A pull request keeps only its newest push. Every push to main runs to the end, because work
# happens on main and each commit needs a result of its own (#754). A group per commit, not
# cancel-in-progress false alone: a group keeps one pending run and cancels the one before it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  jvm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      # The runner has sdkmanager only under the SDK, not on PATH.
      - name: Install the Android SDK platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"'

      # The vertical-text corpus PDF names a Japanese font without embedding it.
      # Without a CJK fallback, AWT draws boxes and fails the page baseline (#627).
      - name: Install CJK fallback fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Test the public-corpus tool
        run: python3 -m unittest discover -s tools -p test_corpus.py -v

      # Each published module's resources/META-INF carries LICENSE and NOTICE into its jar, and
      # kitepdf-core also the licence texts of its bundled fonts, patterns and PDFium data, which
      # ask for their notice in binary copies (#703).
      - name: Check the notices that the jars carry
        run: |
          for m in kitepdf kitepdf-core kitepdf-pdf kitepdf-epub kitepdf-cbz kitepdf-svg kitepdf-xps \
                   kitepdf-javascript kitepdf-net kitepdf-media kitepdf-compose-viewer \
                   kitepdf-native-renderer kitepdf-skia-renderer; do
            cmp LICENSE "$m/resources/META-INF/LICENSE"
            cmp NOTICE "$m/resources/META-INF/NOTICE"
          done
          python3 tools/generate_license_notices.py
          git diff --exit-code -- kitepdf-core/resources/META-INF

      # The public documents are in the checkout; this fails on a changed or missing one.
      - name: Verify the licensed public documents
        run: ./kotlin check corpus

      # The W3C EPUB test suite at the commit docs/epub-conformance.json answers.
      # EpubConformanceTest runs it and fails without it on CI (#497).
      - name: Cache the pinned W3C EPUB test suite
        id: epub-tests-cache
        uses: actions/cache@v4
        with:
          path: .epub-tests
          key: epub-tests-54092b4233253e9aac80e93ec4782b380b4b3403

      - name: Check out the pinned W3C EPUB test suite
        if: steps.epub-tests-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: w3c/epub-tests
          ref: 54092b4233253e9aac80e93ec4782b380b4b3403
          path: .epub-tests
          sparse-checkout: tests
          persist-credentials: false

      # Distribution packages can disable ICC, changing CMYK scores for the
      # same renderer. Keep the oracle version and colour management fixed.
      - name: Cache colour-managed MuPDF 1.27.2
        id: mutool-cache
        uses: actions/cache@v4
        with:
          path: .oracle-bin
          key: mutool-${{ runner.os }}-${{ runner.arch }}-73d3100d-icc-v1

      - name: Check out the pinned oracle source
        if: steps.mutool-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ArtifexSoftware/mupdf
          ref: 73d3100d46d8a9ad634f6ef035bbe78f0f947886
          path: .oracle-source
          submodules: recursive
          persist-credentials: false

      - name: Build the colour-managed oracle
        if: steps.mutool-cache.outputs.cache-hit != 'true'
        run: |
          make -C .oracle-source -j2 build=release HAVE_X11=no HAVE_GLUT=no \
            USE_TESSERACT=no USE_LEPTONICA=no USE_ZXINGCPP=no USE_ZINT=no \
            XCFLAGS=-DFZ_ENABLE_ICC=1 build/release/mutool
          mkdir -p .oracle-bin
          cp .oracle-source/build/release/mutool .oracle-bin/mutool

      - name: Select the pinned oracle
        run: |
          test -x "$GITHUB_WORKSPACE/.oracle-bin/mutool"
          "$GITHUB_WORKSPACE/.oracle-bin/mutool" -v
          echo "MUTOOL=$GITHUB_WORKSPACE/.oracle-bin/mutool" >> "$GITHUB_ENV"

      # PDFium is the second oracle. The parity check fails where PDFium does
      # better than KitePDF, and a new PDFium build moves its verdicts, so pin it.
      - name: Install the pinned PDFium oracle
        run: |
          python3 -m venv "$RUNNER_TEMP/pdfium-venv"
          "$RUNNER_TEMP/pdfium-venv/bin/python" -m pip install --disable-pip-version-check \
            --only-binary :all: --no-deps pypdfium2==5.13.0
          echo "PDFIUM_PYTHON=$RUNNER_TEMP/pdfium-venv/bin/python" >> "$GITHUB_ENV"

      # Also builds the debug APK of the Android sample.
      - name: Build every module (JVM, Android)
        run: ./kotlin build -p jvm -p android

      - name: Test every module (JVM, Android host tests)
        run: ./kotlin test -p jvm -p android

      # The counts per module, in the job summary, marked where skips rose or tests fell since the last
      # green run on main (#942). Reading them never fails the run.
      - name: Summarise the test counts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success -L 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$prev" ]; then gh run download "$prev" --repo "$GITHUB_REPOSITORY" -n test-counts-jvm -D build/previous-counts || true; fi
          python3 scripts/test_summary.py --reports build/reports --label "JVM and Android host tests" --out build/test-counts/jvm.json --previous build/previous-counts/jvm.json

      - name: Upload the test counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-counts-jvm
          path: build/test-counts/
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jvm
          path: build/reports/
          if-no-files-found: ignore

      - name: Upload public-corpus inventory and credits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-corpus-inventory
          path: |
            corpus/manifest.json
            corpus/ATTRIBUTION.md
            corpus/receipt.json
          if-no-files-found: error

      # On failure, also keep what diagnoses a CI-only regression: rendered
      # pages, mutool references and heatmaps, sweep and benchmark reports,
      # and fuzz reproducers.
      - name: Upload diff images and reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-jvm
          path: |
            **/build/difftest/**
            **/build/epub-difftest/**
            **/build/skia-difftest/**
            **/build/xps-difftest/**
            **/build/benchmark/**
            **/build/fuzz/**
            **/build/epub-hashes.txt
          if-no-files-found: ignore

  apple:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      # Every Apple target compiles the same src@apple code, so one simulator and macOS are enough for tests.
      - name: Build every module (iOS simulator, macOS)
        run: ./kotlin build -p iosSimulatorArm64 -p macosArm64

      - name: Test the iOS simulator and macOS arm64 suites
        run: ./kotlin test -p iosSimulatorArm64 -p macosArm64

      # The counts per module, in the job summary, marked where skips rose or tests fell since the last
      # green run on main (#942). Reading them never fails the run.
      - name: Summarise the test counts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success -L 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$prev" ]; then gh run download "$prev" --repo "$GITHUB_REPOSITORY" -n test-counts-apple -D build/previous-counts || true; fi
          python3 scripts/test_summary.py --reports build/reports --label "iOS simulator and macOS arm64" --out build/test-counts/apple.json --previous build/previous-counts/apple.json

      - name: Upload the test counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-counts-apple
          path: build/test-counts/
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      # The JS, wasmJs and wasmWasi tests run on a Node new enough for WebAssembly stack switching (#489).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26.11.1'

      - name: Build every module (JS, wasmJs, wasmWasi)
        run: ./kotlin build -p js -p wasmJs -p wasmWasi

      # The toolchain runs the wasmJs tests in headless Chrome, with 30 seconds for each module.
      # That is enough for the viewer. The other modules run in Node in the next step.
      - name: Test the viewer on wasmJs in headless Chrome
        run: ./kotlin test -p wasmJs -m kitepdf-compose-viewer

      # `./kotlin test` does not run JS or wasmWasi tests. The script links them and runs them in Node with
      # the wasmJs tests, and the Canvas2D tests of kitepdf-native-renderer in headless Chrome.
      - name: Test JS, wasmJs and wasmWasi
        run: python3 scripts/web-tests/run.py

  other-targets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    env:
      # The toolchain runs one task for each core, and each Kotlin/Native compiler takes up to 3 GB.
      # With four at once this 16 GB runner shut down mid-build, most likely out of memory.
      # So the toolchain sees 3 cores. It never runs fewer than 3 tasks at once.
      KOTLIN_CLI_JAVA_OPTIONS: -XX:ActiveProcessorCount=3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: Test the Linux x64 suites
        run: ./kotlin test -p linuxX64

      # The counts per module, in the job summary, marked where skips rose or tests fell since the last
      # green run on main (#942). Reading them never fails the run.
      - name: Summarise the test counts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success -L 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$prev" ]; then gh run download "$prev" --repo "$GITHUB_REPOSITORY" -n test-counts-linux -D build/previous-counts || true; fi
          python3 scripts/test_summary.py --reports build/reports --label "Linux x64" --out build/test-counts/linux.json --previous build/previous-counts/linux.json

      - name: Upload the test counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-counts-linux
          path: build/test-counts/
          if-no-files-found: ignore

      - name: Compile the other native targets
        run: >
          ./kotlin build -p linuxArm64 -p mingwX64
          -p androidNativeArm32 -p androidNativeArm64 -p androidNativeX64 -p androidNativeX86

  other-apple:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      # The tests of these targets compile and link here, but CI does not run them.
      - name: Build every module (iOS devices, Intel iOS simulator, tvOS, watchOS)
        run: >
          ./kotlin build -p iosArm64 -p iosX64 -p tvosArm64 -p tvosSimulatorArm64
          -p watchosArm32 -p watchosArm64 -p watchosDeviceArm64 -p watchosSimulatorArm64

  api:
    runs-on: macos-latest
    # The libraries of every target, then a publish of the JVM consumers' dependencies.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache the Kotlin Toolchain downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: Install the Android SDK platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"'

      # The API checks read the library klibs of every platform and the Android debug classes from build/.
      # Only those compile here: a full build also links every test, and it ran out of time on this runner.
      # The other jobs build the tests of every platform.
      - name: Compile the libraries that the API checks read
        run: |
          tasks=$(./kotlin show tasks | sed -nE 's/^task (:kitepdf[a-z-]*:compile[A-Za-z0-9]+)( .*)?$/\1/p' | grep -vE 'Test|Release|Metadata|Jvm$')
          test -n "$tasks"
          # shellcheck disable=SC2086
          ./kotlin task $tasks

      # A failure here means the public API changed. If the change is intended, run
      # ./kotlin do updateAbi, updateAndroidAbi or updateKlibAbi and commit the api/ files with it.
      - name: Check the public API against the dumps, and KITEPDF_VERSION
        run: ./kotlin check abi androidAbi klibAbi version

      # Maven Local needs no real signing key, so this job signs with a throwaway one.
      - name: Publish the consumer's dependencies to Maven Local
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key 'KitePDF CI <ci@invalid>' rsa3072 sign never
          KOTLIN_TOOLCHAIN_SIGNING_KEY="$(gpg --batch --pinentry-mode loopback --passphrase '' --armor --export-secret-keys)"
          export KOTLIN_TOOLCHAIN_SIGNING_KEY
          ./kotlin publish mavenLocal --transitive -m kitepdf -m kitepdf-native-renderer -m kitepdf-javascript

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test a consumer against them
        working-directory: consumer-test
        run: ./gradlew test --stacktrace
