name: CI

# Build + test gates (T-50).
#
# - `build` (Linux JVM) is the REQUIRED gate: the JVM target is the canonical
#   build of commonMain, and the differential/oracle suites run here (they
#   need mutool from mupdf-tools; without it they report as SKIPPED).
#   It runs on every push and pull request.
# - `apple` and `js` prove the non-JVM targets compile AND pass the common
#   tests before merge. Platform regressions are therefore merge-blocking,
#   instead of being discovered only after they land on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install mupdf-tools (oracle for differential tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y mupdf-tools

      - name: Compile commonMain (JVM)
        run: ./gradlew :kitepdf:compileKotlinJvm --stacktrace

      - name: Test every module (JVM)
        run: >
          ./gradlew
          :kitepdf-core:jvmTest :kitepdf-pdf:jvmTest :kitepdf-epub:jvmTest
          :kitepdf-cbz:jvmTest :kitepdf-svg:jvmTest
          :kitepdf-skia-renderer:jvmTest :kitepdf-compose-viewer:jvmTest
          :kitepdf:jvmTest :kitepdf-net:jvmTest --continue --stacktrace

      - name: Test common code through Android host variants
        run: >
          ./gradlew
          :kitepdf-core:testAndroidHostTest :kitepdf-pdf:testAndroidHostTest
          :kitepdf-epub:testAndroidHostTest :kitepdf-cbz:testAndroidHostTest
          :kitepdf-svg:testAndroidHostTest :kitepdf:testAndroidHostTest
          --continue --stacktrace

      - name: Compile Android rendering backends
        run: >
          ./gradlew
          :kitepdf-native-renderer:compileAndroidMain
          :kitepdf-skia-renderer:compileAndroidMain
          :kitepdf-compose-viewer:compileAndroidMain
          --continue --stacktrace

      - name: Test :kitepdf-native-renderer (JVM oracle + fuzz tests)
        run: ./gradlew :kitepdf-native-renderer:jvmTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jvm
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      # On failure, also keep what diagnoses a CI-only regression: rendered
      # pages, mutool references and heatmaps, sweep and benchmark reports,
      # and fuzz reproducers (ledger 14.2, failure artifacts).
      - name: Upload diff images and reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-jvm
          path: |
            **/build/difftest/**
            **/build/epub-difftest/**
            **/build/skia-difftest/**
            **/build/benchmark/**
            **/build/fuzz/**
            **/build/epub-hashes.txt
          if-no-files-found: ignore

  apple:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Konan (native compiler + prebuilt deps)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Test iOS simulator common suites
        run: >
          ./gradlew
          :kitepdf-core:iosSimulatorArm64Test
          :kitepdf-pdf:iosSimulatorArm64Test
          :kitepdf-epub:iosSimulatorArm64Test
          :kitepdf-cbz:iosSimulatorArm64Test
          :kitepdf-svg:iosSimulatorArm64Test --continue --stacktrace

      - name: Compile iOS rendering backends
        run: >
          ./gradlew
          :kitepdf-native-renderer:compileKotlinIosSimulatorArm64
          :kitepdf-skia-renderer:compileKotlinIosSimulatorArm64
          :kitepdf-compose-viewer:compileKotlinIosSimulatorArm64
          --continue --stacktrace

      - name: Test macOS arm64 suites and CoreGraphics renderer
        run: >
          ./gradlew
          :kitepdf-core:macosArm64Test
          :kitepdf-pdf:macosArm64Test
          :kitepdf-epub:macosArm64Test
          :kitepdf-cbz:macosArm64Test
          :kitepdf-svg:macosArm64Test
          :kitepdf:macosArm64Test
          :kitepdf-native-renderer:macosArm64Test --continue --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-apple
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test JS on Node
        run: >
          ./gradlew
          :kitepdf-core:jsNodeTest :kitepdf-pdf:jsNodeTest
          :kitepdf-epub:jsNodeTest :kitepdf-cbz:jsNodeTest
          :kitepdf-svg:jsNodeTest :kitepdf:jsNodeTest
          :kitepdf-net:jsNodeTest --continue --stacktrace

      - name: Compile browser rendering backends
        run: >
          ./gradlew
          :kitepdf-native-renderer:compileKotlinJs
          :kitepdf-skia-renderer:compileKotlinJs
          :kitepdf-compose-viewer:compileKotlinJs
          --continue --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-js
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
