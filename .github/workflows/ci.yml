name: CI

# Build + test gates.
#
# - `build` (Linux JVM) is the REQUIRED gate: the JVM target is the canonical
#   build of commonMain, and the differential/oracle suites run here (they
#   use a pinned, colour-managed mutool build, and a pinned PDFium for the
#   parity check).
#   It runs on every push and pull request.
# - `apple` and `js` prove the non-JVM targets compile AND pass the common
#   tests before merge. Platform regressions are therefore merge-blocking,
#   instead of being discovered only after they land on main.
# - `other-targets` does the same for the rest of what we publish: it runs the
#   common tests on Linux x64, wasmJs and wasmWasi, and compiles Linux arm64,
#   Windows and the Android native ABIs, so none of them rots unseen (#562).
# - `api` checks the public API of each published module against the dump in
#   its api/ directory. It runs on macOS, the one host that compiles every
#   target, so the Apple-only declarations are checked too.
# - `consumer` publishes the JVM artifacts to Maven Local and builds the
#   project in consumer-test/ against them, by coordinates, as an application
#   does. A broken POM or a missing dependency fails there before a release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The vertical-text corpus PDF names a Japanese font without embedding it.
      # Without a CJK fallback, AWT draws boxes and fails the page baseline (#627).
      - name: Install CJK fallback fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Test the public-corpus tool
        run: python3 -m unittest discover -s tools -p test_corpus.py -v

      # The public documents are in the checkout; this fails on a changed or missing one.
      - name: Verify the licensed public documents
        run: python3 tools/corpus.py verify

      # The W3C EPUB test suite at the commit docs/epub-conformance.json answers.
      # EpubConformanceTest runs it and fails without it on CI (#497).
      - name: Cache the pinned W3C EPUB test suite
        id: epub-tests-cache
        uses: actions/cache@v4
        with:
          path: .epub-tests
          key: epub-tests-54092b4233253e9aac80e93ec4782b380b4b3403

      - name: Check out the pinned W3C EPUB test suite
        if: steps.epub-tests-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: w3c/epub-tests
          ref: 54092b4233253e9aac80e93ec4782b380b4b3403
          path: .epub-tests
          sparse-checkout: tests
          persist-credentials: false

      # Distribution packages can disable ICC, changing CMYK scores for the
      # same renderer. Keep the oracle version and colour management fixed.
      - name: Cache colour-managed MuPDF 1.27.2
        id: mutool-cache
        uses: actions/cache@v4
        with:
          path: .oracle-bin
          key: mutool-${{ runner.os }}-${{ runner.arch }}-73d3100d-icc-v1

      - name: Check out the pinned oracle source
        if: steps.mutool-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ArtifexSoftware/mupdf
          ref: 73d3100d46d8a9ad634f6ef035bbe78f0f947886
          path: .oracle-source
          submodules: recursive
          persist-credentials: false

      - name: Build the colour-managed oracle
        if: steps.mutool-cache.outputs.cache-hit != 'true'
        run: |
          make -C .oracle-source -j2 build=release HAVE_X11=no HAVE_GLUT=no \
            USE_TESSERACT=no USE_LEPTONICA=no USE_ZXINGCPP=no USE_ZINT=no \
            XCFLAGS=-DFZ_ENABLE_ICC=1 build/release/mutool
          mkdir -p .oracle-bin
          cp .oracle-source/build/release/mutool .oracle-bin/mutool

      - name: Select the pinned oracle
        run: |
          test -x "$GITHUB_WORKSPACE/.oracle-bin/mutool"
          "$GITHUB_WORKSPACE/.oracle-bin/mutool" -v
          echo "MUTOOL=$GITHUB_WORKSPACE/.oracle-bin/mutool" >> "$GITHUB_ENV"

      # PDFium is the second oracle. The parity check fails where PDFium does
      # better than KitePDF, and a new PDFium build moves its verdicts, so pin it.
      - name: Install the pinned PDFium oracle
        run: |
          python3 -m venv "$RUNNER_TEMP/pdfium-venv"
          "$RUNNER_TEMP/pdfium-venv/bin/python" -m pip install --disable-pip-version-check \
            --only-binary :all: --no-deps pypdfium2==5.13.0
          echo "PDFIUM_PYTHON=$RUNNER_TEMP/pdfium-venv/bin/python" >> "$GITHUB_ENV"

      - name: Compile commonMain (JVM)
        run: ./gradlew :kitepdf:compileKotlinJvm --stacktrace

      - name: Test every module (JVM)
        run: >
          ./gradlew
          :kitepdf-difftest:jvmTest :kitepdf-core:jvmTest :kitepdf-pdf:jvmTest :kitepdf-epub:jvmTest
          :kitepdf-cbz:jvmTest :kitepdf-svg:jvmTest :kitepdf-xps:jvmTest
          :kitepdf-skia-renderer:jvmTest :kitepdf-compose-viewer:jvmTest
          :kitepdf:jvmTest :kitepdf-net:jvmTest :kitepdf-javascript:jvmTest :kitepdf-media:jvmTest
          :sample:jvmTest --continue --stacktrace

      - name: Test common code through Android host variants
        run: >
          ./gradlew
          :kitepdf-core:testAndroidHostTest :kitepdf-pdf:testAndroidHostTest
          :kitepdf-epub:testAndroidHostTest :kitepdf-cbz:testAndroidHostTest
          :kitepdf-svg:testAndroidHostTest :kitepdf-xps:testAndroidHostTest :kitepdf:testAndroidHostTest
          :kitepdf-javascript:testAndroidHostTest
          :kitepdf-compose-viewer:testAndroidHostTest :kitepdf-native-renderer:testAndroidHostTest
          --continue --stacktrace

      - name: Compile Android rendering backends
        run: >
          ./gradlew
          :kitepdf-native-renderer:compileAndroidMain
          :kitepdf-skia-renderer:compileAndroidMain
          :kitepdf-compose-viewer:compileAndroidMain
          :kitepdf-media:compileAndroidMain
          :sample:compileAndroidMain
          --continue --stacktrace

      - name: Test :kitepdf-native-renderer (JVM oracle + fuzz tests)
        run: ./gradlew :kitepdf-native-renderer:jvmTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jvm
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      - name: Upload public-corpus inventory and credits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-corpus-inventory
          path: |
            corpus/manifest.json
            corpus/ATTRIBUTION.md
            corpus/receipt.json
          if-no-files-found: error

      # On failure, also keep what diagnoses a CI-only regression: rendered
      # pages, mutool references and heatmaps, sweep and benchmark reports,
      # and fuzz reproducers.
      - name: Upload diff images and reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-jvm
          path: |
            **/build/difftest/**
            **/build/epub-difftest/**
            **/build/skia-difftest/**
            **/build/xps-difftest/**
            **/build/benchmark/**
            **/build/fuzz/**
            **/build/epub-hashes.txt
          if-no-files-found: ignore

  apple:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Konan (native compiler + prebuilt deps)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Test iOS simulator common suites
        run: >
          ./gradlew
          :kitepdf-core:iosSimulatorArm64Test
          :kitepdf-pdf:iosSimulatorArm64Test
          :kitepdf-epub:iosSimulatorArm64Test
          :kitepdf-cbz:iosSimulatorArm64Test
          :kitepdf-svg:iosSimulatorArm64Test
          :kitepdf-xps:iosSimulatorArm64Test
          :kitepdf-javascript:iosSimulatorArm64Test --continue --stacktrace

      - name: Compile iOS rendering backends
        run: >
          ./gradlew
          :kitepdf-native-renderer:compileKotlinIosSimulatorArm64
          :kitepdf-skia-renderer:compileKotlinIosSimulatorArm64
          :kitepdf-compose-viewer:compileKotlinIosSimulatorArm64
          :kitepdf-media:compileKotlinIosSimulatorArm64
          :sample:compileKotlinIosSimulatorArm64
          --continue --stacktrace

      - name: Test macOS arm64 suites and CoreGraphics renderer
        run: >
          ./gradlew
          :kitepdf-core:macosArm64Test
          :kitepdf-pdf:macosArm64Test
          :kitepdf-epub:macosArm64Test
          :kitepdf-cbz:macosArm64Test
          :kitepdf-svg:macosArm64Test
          :kitepdf-xps:macosArm64Test
          :kitepdf:macosArm64Test
          :kitepdf-native-renderer:macosArm64Test
          :kitepdf-javascript:macosArm64Test --continue --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-apple
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  api:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Konan (native compiler + prebuilt deps)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # A failure here means the public API changed. If the change is intended,
      # run ./gradlew updateKotlinAbi and commit the api/ files with it.
      - name: Check the public API against the dumps
        run: ./gradlew checkKotlinAbi --continue --stacktrace

  consumer:
    runs-on: macos-latest
    # A passing run takes about 35 minutes, so a slow runner needs the margin.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Konan (native compiler + prebuilt deps)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Maven Local needs no signing key, so the signing that a release uses is off here.
      - name: Publish the JVM artifacts to Maven Local
        run: >
          ./gradlew publishKotlinMultiplatformPublicationToMavenLocal publishJvmPublicationToMavenLocal
          -PRELEASE_SIGNING_ENABLED=false --stacktrace

      - name: Build and test a consumer against them
        run: ./gradlew -p consumer-test test --stacktrace

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test JS on Node
        run: >
          ./gradlew
          :kitepdf-core:jsNodeTest :kitepdf-pdf:jsNodeTest
          :kitepdf-epub:jsNodeTest :kitepdf-cbz:jsNodeTest
          :kitepdf-svg:jsNodeTest :kitepdf-xps:jsNodeTest :kitepdf:jsNodeTest
          :kitepdf-net:jsNodeTest :kitepdf-javascript:jsNodeTest --continue --stacktrace

      - name: Compile browser rendering backends
        run: >
          ./gradlew
          :kitepdf-native-renderer:compileKotlinJs
          :kitepdf-skia-renderer:compileKotlinJs
          :kitepdf-compose-viewer:compileKotlinJs
          :sample:compileKotlinJs
          --continue --stacktrace

      - name: Test the browser canvas in headless Chrome
        run: ./gradlew :kitepdf-native-renderer:jsBrowserTest --continue --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-js
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  other-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Konan (native compiler + prebuilt deps)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Test Linux x64 common suites
        run: >
          ./gradlew
          :kitepdf-core:linuxX64Test :kitepdf-pdf:linuxX64Test
          :kitepdf-epub:linuxX64Test :kitepdf-cbz:linuxX64Test
          :kitepdf-svg:linuxX64Test :kitepdf-xps:linuxX64Test :kitepdf:linuxX64Test
          :kitepdf-javascript:linuxX64Test
          --continue --stacktrace

      # Two workers: linking the wasm test binaries four at a time ran a
      # 4-core, 15 GB machine out of memory and killed the daemon (#562).
      - name: Test wasmJs and wasmWasi on Node
        run: >
          ./gradlew --max-workers=2
          :kitepdf-core:wasmJsNodeTest :kitepdf-pdf:wasmJsNodeTest
          :kitepdf-epub:wasmJsNodeTest :kitepdf-cbz:wasmJsNodeTest
          :kitepdf-svg:wasmJsNodeTest :kitepdf-xps:wasmJsNodeTest :kitepdf:wasmJsNodeTest
          :kitepdf-javascript:wasmJsNodeTest
          :kitepdf-core:wasmWasiNodeTest :kitepdf-pdf:wasmWasiNodeTest
          :kitepdf-epub:wasmWasiNodeTest :kitepdf-cbz:wasmWasiNodeTest
          :kitepdf-svg:wasmWasiNodeTest :kitepdf-xps:wasmWasiNodeTest :kitepdf:wasmWasiNodeTest
          --continue --stacktrace

      - name: Compile the other native and wasm targets
        run: |
          tasks=""
          for m in kitepdf-core kitepdf-pdf kitepdf-epub kitepdf-cbz kitepdf-svg kitepdf-xps kitepdf; do
            for t in LinuxArm64 MingwX64 AndroidNativeArm32 AndroidNativeArm64 AndroidNativeX64 AndroidNativeX86; do
              tasks="$tasks :$m:compileKotlin$t"
            done
          done
          ./gradlew $tasks \
            :kitepdf-net:compileKotlinLinuxX64 :kitepdf-net:compileKotlinLinuxArm64 \
            :kitepdf-net:compileKotlinMingwX64 :kitepdf-net:compileKotlinWasmJs \
            :kitepdf-javascript:compileKotlinLinuxArm64 :kitepdf-javascript:compileKotlinMingwX64 \
            :kitepdf-skia-renderer:compileKotlinLinuxX64 :kitepdf-skia-renderer:compileKotlinLinuxArm64 \
            :kitepdf-skia-renderer:compileKotlinWasmJs :kitepdf-compose-viewer:compileKotlinWasmJs \
            --continue --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-other-targets
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
