[versions] #######################################################################################
# Toolchain
kotlin = "2.4.20"
agp = "9.4.1"
vanniktechPublish = "0.37.0"
dokka = "2.3.0-Beta"

# Compose Multiplatform, used by :kitepdf-compose-viewer and :sample. :kitepdf never depends on it.
composeMultiplatform = "1.12.1"
composeMaterial3 = "1.13.0-alpha01"

# Android platform bridge (sample only)
activityCompose = "1.14.0-alpha03"

# Skiko: JetBrains' Skia bindings. Used by :kitepdf-skia-renderer. Compose Multiplatform
# rides on Skiko under the hood on JVM Desktop + iOS, so this gives us the same
# renderer Compose uses, without the Compose runtime sitting on top.
skiko = "0.150.1"

# KiteImageCodec. The Kite lineage's shared image engine, and :kitepdf-core's one
# runtime dependency beyond kotlin-stdlib. Up to 0.1.0 it was published as
# `kiteimage`, with the package io.github.yuroyami.kiteimage.
kiteimagecodec = "0.2.0"

# KiteJS. The Kite lineage's JavaScript engine. Used ONLY by :kitepdf-javascript,
# so no other module carries a script engine.
kitejs = "0.2.0"
# KitePlayer: the Kite lineage's media player. Used ONLY by :kitepdf-media, the optional
# EPUB audio and video artifact. It carries FFmpeg through KiteFFmpeg.
kiteplayer = "0.2.0"

# Robolectric, for the Android host tests of :kitepdf-compose-viewer only: its native graphics
# draw a Compose canvas on the JVM, so Android text can be checked without a device.
robolectric = "4.17"

# Ktor client. Used ONLY by :kitepdf-net, the optional remote-loading artifact.
# No other module may depend on it: the engine stays kotlin-stdlib + KiteImageCodec.
ktor = "3.6.0"

# kotlinx.coroutines. :kitepdf-epub fetches a book's remote resources with it (#38), and Compose and
# Ktor bring the same library to the viewer and :kitepdf-net. The version Ktor itself depends on.
kotlinxCoroutines = "1.11.0"

[libraries] ######################################################################################
# KiteImageCodec supplies every image codec :kitepdf-core decodes through: JPEG
# (baseline and progressive), PNG, GIF, BMP, JPEG 2000, JBIG2 and CCITT.
kiteimagecodec = { module = "io.github.yuroyami:kiteimagecodec", version.ref = "kiteimagecodec" }

# KiteJS runs document JavaScript, :kitepdf-javascript only.
kitejs = { module = "io.github.yuroyami:kitejs", version.ref = "kitejs" }
kiteplayer = { module = "io.github.yuroyami:kiteplayer", version.ref = "kiteplayer" }
kiteplayer-compose = { module = "io.github.yuroyami:kiteplayer-compose", version.ref = "kiteplayer" }

robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# Ktor, :kitepdf-net only. ktor-client-core carries no engine; the consumer
# picks one (CIO, OkHttp, Darwin, Js...) exactly as with any Ktor library.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Skia (no Compose), used by :kitepdf-skia-renderer. `skiko` is the multiplatform
# root (common org.jetbrains.skia API; resolves skiko-awt on JVM, native
# klibs on Apple/Linux, CanvasKit on js/wasm). `skiko-awt` is the JVM API
# jar; the per-platform AWT native runtime is selected at build time below.
skiko = { module = "org.jetbrains.skiko:skiko", version.ref = "skiko" }
skiko-awt = { module = "org.jetbrains.skiko:skiko-awt", version.ref = "skiko" }
skiko-awt-runtime-macos-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-macos-arm64", version.ref = "skiko" }
skiko-awt-runtime-macos-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-macos-x64", version.ref = "skiko" }
skiko-awt-runtime-linux-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-x64", version.ref = "skiko" }
skiko-awt-runtime-linux-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-arm64", version.ref = "skiko" }
skiko-awt-runtime-windows-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-windows-x64", version.ref = "skiko" }
skiko-awt-runtime-windows-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-windows-arm64", version.ref = "skiko" }

# Compose Multiplatform, for :kitepdf-compose-viewer and the sample app ONLY. The :kitepdf module must NEVER depend on these.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-desktop-currentOs = { module = "org.jetbrains.compose.desktop:desktop", version.ref = "composeMultiplatform" }
# Compose's back events, the version Compose 1.12.1 requires. Only the tests of :kitepdf-media use it,
# to send the back event that a desktop window makes of Escape, since a test scene has no window.
compose-navigationevent = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version = "1.1.0" }

# Android (sample only)
android-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

[bundles] ########################################################################################
compose-multiplatform = [
    "compose-runtime", "compose-foundation", "compose-ui",
    "compose-components-resources", "compose-material3",
]

[plugins] ########################################################################################
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-plugin = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }

android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
