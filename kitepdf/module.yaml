# The umbrella artifact. It carries no code of its own: it re-exports every document handler, so a consumer
# can depend on one coordinate and get the whole engine. Depend on kitepdf-pdf for PDF only.

product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - js
    - wasmJs
    - wasmWasi
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - linuxX64
    - linuxArm64
    - mingwX64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX86
    - androidNativeX64

description: >-
  KitePDF umbrella - one dependency that pulls every KitePDF document handler (PDF, EPUB, CBZ, SVG, XPS/OpenXPS) on
  a shared pure-Kotlin core. Depend on kitepdf-pdf for PDF only.

apply:
  - //common.module-template.yaml
  - //library.module-template.yaml

# KiteDoc.openFile through stdio, for the native targets that have neither java.io nor Foundation.
# Apple has its own NSData version. The stdio calls cannot live in one shared folder: the metadata
# compiler refuses cinterop signatures whose C widths differ between member targets ("numbers with
# different bit widths"). So the folders group the targets by ABI family. Windows, the one
# LLP64 target, has its own src@mingw.
aliases:
  - posixFile: [ linuxX64, linuxArm64, mingwX64, androidNativeArm32, androidNativeArm64, androidNativeX86, androidNativeX64 ]
  - posixLp64: [ linuxX64, linuxArm64, androidNativeArm64, androidNativeX64 ]
  - posixIlp32: [ androidNativeArm32, androidNativeX86 ]

# Re-export every handler, so consumers see their whole API.
dependencies:
  - //kitepdf-pdf: exported
  - //kitepdf-epub: exported
  - //kitepdf-cbz: exported
  - //kitepdf-svg: exported
  - //kitepdf-xps: exported

settings:
  kotlin:
    optIns: [ kotlin.RequiresOptIn, kotlin.experimental.ExperimentalNativeApi ]
  android:
    namespace: io.github.yuroyami.kitepdf.bundle
  publishing:
    pom:
      name: KitePDF

# Gradle named the klib "io.github.yuroyami:kitepdf". Keep that name, or libraries built against
# earlier releases fail to link on Kotlin/Native. Set it per platform: on @native, it also
# renames the klibs of shared native code, which must keep their own names.
settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kitepdf ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kitepdf ]

settings@wasmWasi:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kitepdf ]

settings@iosArm64:
