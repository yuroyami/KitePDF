plugins:
  abi-check:
    enabled: true
    # Also checks the Android classes against api/android, as the Gradle build did.
    android: true
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ androidNativeArm32, androidNativeArm64, androidNativeX64, androidNativeX86, iosArm64, iosSimulatorArm64, iosX64, js, linuxArm64, linuxX64, macosArm64, mingwX64, tvosArm64, tvosSimulatorArm64, wasmJs, wasmWasi, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64 ]
  dokka:
    enabled: true
    moduleName: kitepdf
    includes: [ Module.md ]
    platformSourceDirs: [ src@jvm, src@android, src@apple, src@posixFile ]
    customStyleSheets: [ ../docs/api-theme/kite.css ]
    templatesDir: ../dokka-templates
    footerMessage: Apache-2.0 · KitePDF is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/KitePDF/blob/main/kitepdf/src
    # `./kotlin do dokkaSite` merges the pages of these modules into build/dokka/html.
    siteName: KitePDF
    siteModules: [ kitepdf, kitepdf-core, kitepdf-pdf, kitepdf-epub, kitepdf-cbz, kitepdf-xps, kitepdf-svg, kitepdf-javascript, kitepdf-net, kitepdf-compose-viewer, kitepdf-media, kitepdf-native-renderer, kitepdf-skia-renderer ]
    siteIncludes:
      - ../kitepdf-core/Module.md
      - ../kitepdf-pdf/Module.md
      - ../kitepdf-epub/Module.md
      - ../kitepdf-cbz/Module.md
      - ../kitepdf-xps/Module.md
      - ../kitepdf-svg/Module.md
      - ../kitepdf-javascript/Module.md
      - ../kitepdf-net/Module.md
      - ../kitepdf-compose-viewer/Module.md
      - ../kitepdf-media/Module.md
      - ../kitepdf-native-renderer/Module.md
      - ../kitepdf-skia-renderer/Module.md
