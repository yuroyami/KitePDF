settings@watchosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf, -Xshort-module-name=kitepdf ]

settings@linuxX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf, -Xshort-module-name=kitepdf ]

settings@linuxArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf, -Xshort-module-name=kitepdf ]

settings@mingwX64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kitepdf, -Xshort-module-name=kitepdf ]

settings@androidNativeArm32:
  kotlin:
